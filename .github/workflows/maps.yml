# Every hour: if ECMWF or GFS published a newer run, download it, make the map images and
# publish them on GitHub Pages (https://kampkas2000-debug.github.io/pulsavio-weather/).
name: Weather maps

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["engine/**", "tests/**", ".github/workflows/maps.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weather-maps
  cancel-in-progress: false

env:
  PAGES_URL: https://kampkas2000-debug.github.io/pulsavio-weather/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt pytest
      - run: python -m pytest -q tests/test_engine.py
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else python engine/build.py --check; fi
      - if: steps.check.outputs.changed == 'true'
        run: python engine/build.py --out site
      - if: steps.check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub pauses scheduled workflows in repositories with no activity for 60 days:
      # one empty commit a month keeps the maps updating.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "00" ]; then
            git config user.name "pulsavio-maps"; git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "Keep weather maps schedule active" && git push
          fi

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
